<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self.exe — Sketches</title>
  <style>
    :root {
      font-family: 'Courier New', Courier, monospace;
      color: #1b1613;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.24)),
        url('images/Screenshot 2025-06-21 at 15.29.33 copy.png') center/cover fixed;
      color: inherit;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 4rem;
    }

    .micro-nav {
      position: fixed;
      top: 1.25rem;
      left: 2rem;
      display: flex;
      gap: 1.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .micro-nav a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.15rem;
      transition: border-color 0.2s ease;
    }

    .micro-nav a:hover,
    .micro-nav a:focus-visible {
      border-color: currentColor;
    }

    article {
      width: min(1240px, 96vw);
      background: rgba(255, 255, 255, 0.88);
      border-radius: 28px;
      padding: clamp(1.5rem, 4vw, 3rem);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.12);
      line-height: 1.7;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0.8rem 0 1.5rem;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #61422a;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.4rem;
      text-transform: uppercase;
      font-size: 0.84rem;
      letter-spacing: 0.2em;
    }

    .links a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      padding-bottom: 0.2rem;
    }

    .sketch-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.1rem;
      margin-top: 1rem;
    }

    .sketch-item {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(97, 66, 42, 0.18);
      border-radius: 18px;
      padding: 0.45rem;
    }

    .sketch-item img {
      width: 100%;
      border-radius: 12px;
      display: block;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
    }

    .sketch-item p {
      margin: 0.7rem 0 0.15rem;
      font-size: 0.86rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #553726;
    }

    @media (max-width: 820px) {
      .sketch-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
<style id="global-nav-style">
  @font-face {
    font-family: "CjNavCormorant";
    src: url("fonts/cormorantgaramond.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    --nav-font-family: "CjNavCormorant", "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --nav-font-size: clamp(1.25rem, 1.1rem + 0.45vw, 1.9rem);
    --nav-letter-spacing: 0.08em;
    --nav-color: #2f2418;
    --nav-hover-color: #5b3821;
    --nav-shadow: 0 1px 6px rgba(255, 250, 240, 0.55);
    --nav-hover-shadow: 0 2px 10px rgba(255, 248, 232, 0.72);
  }

  .micro-nav,
  .site-nav {
    font-family: var(--nav-font-family);
    font-size: var(--nav-font-size);
    letter-spacing: var(--nav-letter-spacing);
    font-weight: 600;
  }

  .micro-nav a,
  .site-nav a {
    color: var(--nav-color) !important;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.18em;
    text-shadow: var(--nav-shadow);
    transition: color 0.25s ease, text-shadow 0.25s ease, border-color 0.25s ease;
  }

  .micro-nav a:hover,
  .micro-nav a:focus-visible,
  .site-nav a:hover,
  .site-nav a:focus-visible {
    color: var(--nav-hover-color) !important;
    text-shadow: var(--nav-hover-shadow);
  }

  @media (max-width: 900px) {
    .micro-nav,
    .site-nav {
      font-size: clamp(1rem, 0.95rem + 0.45vw, 1.25rem);
      letter-spacing: 0.06em;
    }
  }
</style>

</head>
<body>
  <nav class="micro-nav" aria-label="Site navigation">
    <a href="index.html">CJ Li</a>
    <a href="unit-1.html">Echo Maze</a>
    <a href="unit-2.html">Self.exe</a>
    <a href="soulmate.html">Soulmate</a>
    <a href="home.html">More</a>
  </nav>

  <article>
    <div class="links">
      <a href="unit-2.html">← Back to Self.exe</a>
      <a href="index.html">Back to Home</a>
    </div>
    <h1>Sketches</h1>
    <p class="subtitle">Process Visual Fragments</p>

    <div class="sketch-grid" aria-label="Self.exe sketches gallery">
      <figure class="sketch-item">
        <img src="images/ChatGPT Image 2025年11月14日 19_59_56 copy.png" alt="Self.exe sketch image from November 14, 2025" />
        <p>Sketch 01</p>
      </figure>
      <figure class="sketch-item">
        <img src="images/ChatGPT Image 2026年1月28日 17_42_01 copy.png" alt="Self.exe sketch image from January 28, 2026" />
        <p>Sketch 02</p>
      </figure>
    </div>
  </article>
</body>
</html>
