<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>burning hearts | Small Experiment</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    @font-face {
      font-family: "CjNavCormorant";
      src: url("fonts/cormorantgaramond.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --display: "CjNavCormorant", "Cormorant Garamond", "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 105, 80, 0.2), transparent 38%),
        radial-gradient(circle at 82% 72%, rgba(68, 76, 140, 0.2), transparent 42%),
        #09050a;
      color: #f2e8da;
      font-family: var(--display);
      padding: 4.5rem 1rem 1rem;
      display: grid;
      place-items: center;
      gap: 0.8rem;
    }

    .micro-nav {
      position: fixed;
      top: 1.1rem;
      left: 1.2rem;
      display: flex;
      gap: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .micro-nav a {
      color: #f0e2c6;
      text-decoration: none;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      font-size: clamp(1.7rem, 1.3rem + 1.5vw, 2.5rem);
    }

    #canvas-shell {
      width: min(540px, 100%);
      background: rgba(10, 10, 15, 0.66);
      border-radius: 18px;
      padding: 0.9rem;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
      display: grid;
      justify-items: center;
    }

    #canvas-shell canvas {
      max-width: 100%;
      height: auto !important;
      display: block;
      border-radius: 12px;
    }

    .hint {
      margin: 0;
      color: #dbd4cb;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <nav class="canvas-nav">
    <a href="small-experiment.html">← Small Experiments</a>
    <a href="index.html">CJ Li</a>
  </nav>

  <h1 style="display:none">burning hearts</h1>
  <div id="canvas-shell"></div>
  <p class="hint">A soft snowfall and sudden bursts of ember trails.</p>

  <script>
    let flakes = [];
    let sparks = [];

    function setup() {
      const canvas = createCanvas(500, 600);
      canvas.parent("canvas-shell");

      for (let i = 0; i < 420; i++) {
        flakes.push(new Snowflake(random(width), random(height)));
      }
    }

    function draw() {
      drawSky();

      let wind = createVector(map(noise(frameCount * 0.008), 0, 1, -0.03, 0.03), 0);
      let gravity = createVector(0, 0.032);

      for (let f of flakes) {
        f.applyForce(p5.Vector.mult(gravity, f.mass));
        f.applyForce(p5.Vector.mult(wind, 1.0 / (0.25 + f.mass)));
        applyDrag(f, 0.012);
        f.update();
        f.wrap();
        f.display();
      }

      if (random(1) < 0.045) {
        explode(createVector(random(width), random(height * 0.15, height * 0.45)));
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        let s = sparks[i];

        s.applyForce(p5.Vector.mult(gravity, s.mass));
        s.applyForce(p5.Vector.mult(wind, 0.5));
        applyDrag(s, 0.014);

        s.update();
        s.life -= 0.016;
        s.display();

        if (s.life <= 0) sparks.splice(i, 1);
      }
    }

    function drawSky() {
      for (let y = 0; y < height; y++) {
        let t = y / height;

        let r = lerp(210, 25, t);
        let g = lerp(120, 40, t);
        let b = lerp(90, 95, t);

        stroke(r, g, b);
        line(0, y, width, y);
      }
    }

    function explode(pos) {
      let layers = 3;
      let count = 28;

      for (let l = 1; l <= layers; l++) {
        for (let i = 0; i < count; i++) {
          let dir = p5.Vector.random2D();
          dir.mult(random(1.5 * l, 3.0 * l));
          sparks.push(new Spark(pos.x, pos.y, dir, l));
        }
      }
    }

    function applyDrag(obj, c) {
      let v = obj.vel.copy();
      let speed = v.mag();
      if (speed > 0.0001) {
        let dragMag = c * speed * speed;
        let drag = v.copy().mult(-1).normalize().mult(dragMag);
        obj.applyForce(drag);
      }
    }

    class Snowflake {
      constructor(x, y) {
        this.pos = createVector(x, y);
        this.vel = createVector(random(-0.16, 0.16), random(0.12, 0.55));
        this.acc = createVector();
        this.r = random(0.8, 2.2);
        this.mass = this.r * 0.3;
      }

      update() {
        this.vel.add(this.acc);
        this.pos.add(this.vel);
        this.acc.mult(0);
      }

      applyForce(f) {
        if (this.mass > 0) {
          let force = p5.Vector.div(f, this.mass);
          this.acc.add(force);
        }
      }

      wrap() {
        if (this.pos.y > height + 10) {
          this.pos.y = random(-140, -10);
          this.pos.x = random(width);
          this.vel.y = random(0.12, 0.55);
        }
        if (this.pos.x < -20) this.pos.x = width + 20;
        if (this.pos.x > width + 20) this.pos.x = -20;
      }

      display() {
        push();
        translate(this.pos.x, this.pos.y);
        noStroke();
        fill(220, 235, 245, 160);
        circle(0, 0, this.r * 2);
        pop();
      }
    }

    class Spark {
      constructor(x, y, v, layer) {
        this.pos = createVector(x, y);
        this.vel = v.copy();
        this.acc = createVector();
        this.mass = 1.0;
        this.life = 1.0;
        this.layer = layer;

        this.size = map(layer, 1, 3, 7.5, 4.0);

        this.r = 255;
        this.g = random(40, 140);
        this.b = random(40, 90);
      }

      update() {
        this.vel.add(this.acc);
        this.pos.add(this.vel);
        this.acc.mult(0);
      }

      applyForce(f) {
        if (this.mass > 0) {
          let force = p5.Vector.div(f, this.mass);
          this.acc.add(force);
        }
      }

      display() {
        push();
        translate(this.pos.x, this.pos.y);
        noStroke();

        let steps = 18;
        for (let i = 0; i < steps; i++) {
          let t = i / steps;
          let alpha = (1.0 - t) * 255 * this.life;
          let offset = p5.Vector.mult(this.vel, -i * 0.45);

          fill(this.r, this.g, this.b, alpha);
          circle(offset.x, offset.y, this.size * (1.0 - t));
        }

        pop();
      }
    }
  </script>
</body>
</html>
