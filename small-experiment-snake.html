<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake | Small Experiment</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    @font-face {
      font-family: "CjNavCormorant";
      src: url("fonts/cormorantgaramond.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --display: "CjNavCormorant", "Cormorant Garamond", "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 16% 16%, rgba(0, 213, 255, 0.12), transparent 40%),
        radial-gradient(circle at 82% 78%, rgba(123, 97, 255, 0.12), transparent 42%),
        #06070d;
      color: #efe7d7;
      font-family: var(--display);
      padding: 4.5rem 1rem 1rem;
      display: grid;
      place-items: center;
      gap: 0.8rem;
    }

    .micro-nav {
      position: fixed;
      top: 1.1rem;
      left: 1.2rem;
      display: flex;
      gap: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .micro-nav a {
      color: #f0e2c6;
      text-decoration: none;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(1.7rem, 1.3rem + 1.5vw, 2.5rem);
    }

    #canvas-shell {
      width: min(940px, 100%);
      background: rgba(10, 12, 17, 0.68);
      border-radius: 18px;
      padding: 0.9rem;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
      display: grid;
      justify-items: center;
    }

    #canvas-shell canvas {
      max-width: 100%;
      height: auto !important;
      display: block;
      border-radius: 12px;
    }

    .hint {
      margin: 0;
      color: #d8dce1;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <nav class="canvas-nav">
    <a href="small-experiment.html">← Small Experiments</a>
    <a href="index.html">CJ Li</a>
  </nav>

  <h1 style="display:none">Snake</h1>
  <div id="canvas-shell"></div>
  <p class="hint">Click to respawn snakes.</p>

  <script>
    let palette = [];
    let snakes = [];

    function setup() {
      const canvas = createCanvas(900, 900);
      canvas.parent("canvas-shell");

      palette = [
        color("coral"),
        color("#00D5FF"),
        color("#1A3CFF"),
        color("#7B61FF"),
        color("#2EC4B6"),
      ];

      spawnSnakes(10);
    }

    function draw() {
      background(245, 22);

      for (let i = 0; i < snakes.length; i++) {
        snakes[i].wander();
        snakes[i].move();
        snakes[i].wrap();
        snakes[i].updateColor();
      }

      checkTouchTrails();

      for (let i = 0; i < snakes.length; i++) {
        snakes[i].display();
      }
    }

    function mousePressed() {
      spawnSnakes(6);
    }

    function spawnSnakes(n) {
      snakes = [];
      for (let i = 0; i < n; i++) {
        let x = random(width);
        let y = random(height);
        snakes.push(new Snake(x, y));
      }
    }

    function checkTouchTrails() {
      let recentCount = 70;
      let step = 3;

      for (let i = 0; i < snakes.length; i++) {
        for (let j = i + 1; j < snakes.length; j++) {
          let a = snakes[i];
          let b = snakes[j];

          if (a.cooldown !== 0 || b.cooldown !== 0) continue;

          let threshold = (a.thickness + b.thickness) * 0.55;

          let hit = false;

          if (p5.Vector.dist(a.pos, b.pos) < threshold) hit = true;

          if (!hit) hit = headHitsTrail(a, b, threshold, recentCount, step);
          if (!hit) hit = headHitsTrail(b, a, threshold, recentCount, step);

          if (hit) {
            a.changeToRandomColor();
            b.changeToRandomColor();

            a.cooldown = 25;
            b.cooldown = 25;

            let pushDir = p5.Vector.sub(a.pos, b.pos);
            if (pushDir.mag() > 0.001) {
              pushDir.setMag(0.7);
              a.applyForce(pushDir);
              b.applyForce(pushDir.mult(-1));
            }
          }
        }
      }
    }

    function headHitsTrail(headSnake, trailSnake, threshold, recentCount, step) {
      let h = headSnake.pos;
      let arr = trailSnake.history;
      let start = max(0, arr.length - recentCount);

      for (let k = start; k < arr.length; k += step) {
        if (p5.Vector.dist(h, arr[k]) < threshold) return true;
      }
      return false;
    }

    class Snake {
      constructor(x, y) {
        this.pos = createVector(x, y);
        this.vel = p5.Vector.random2D().mult(1.2);
        this.acc = createVector(0, 0);

        this.thickness = random(22, 34);
        this.history = [];
        this.maxLen = int(random(70, 110));

        this.colorIndex = floor(random(palette.length));
        this.targetColor = palette[this.colorIndex];
        this.currentColor = this.targetColor;

        this.nx = random(1000);
        this.ny = random(1000);

        this.cooldown = 0;
      }

      applyForce(f) {
        this.acc.add(f);
      }

      wander() {
        let t = frameCount * 0.01;

        let n = noise(this.pos.x * 0.003 + this.nx, this.pos.y * 0.003 + this.ny, t);
        let angle = n * TWO_PI * 2;

        let force1 = p5.Vector.fromAngle(angle);
        force1.setMag(0.14);
        this.applyForce(force1);

        let center = createVector(width / 2, height / 2);
        let force2 = p5.Vector.sub(center, this.pos);
        force2.setMag(0.03);
        this.applyForce(force2);
      }

      move() {
        if (this.cooldown > 0) this.cooldown--;

        let drag = this.vel.copy().mult(-1);
        drag.mult(0.02);
        this.applyForce(drag);

        this.vel.add(this.acc);
        this.vel.limit(2.9);
        this.pos.add(this.vel);
        this.acc.mult(0);

        this.history.push(this.pos.copy());
        while (this.history.length > this.maxLen) this.history.shift();
      }

      wrap() {
        let wrapped = false;

        if (this.pos.x < -40) {
          this.pos.x = width + 40;
          wrapped = true;
        } else if (this.pos.x > width + 40) {
          this.pos.x = -40;
          wrapped = true;
        }

        if (this.pos.y < -40) {
          this.pos.y = height + 40;
          wrapped = true;
        } else if (this.pos.y > height + 40) {
          this.pos.y = -40;
          wrapped = true;
        }

        if (wrapped) this.history = [];
      }

      changeToRandomColor() {
        let newIndex = floor(random(palette.length));
        while (newIndex === this.colorIndex) {
          newIndex = floor(random(palette.length));
        }
        this.colorIndex = newIndex;
        this.targetColor = palette[this.colorIndex];
      }

      updateColor() {
        this.currentColor = lerpColor(this.currentColor, this.targetColor, 0.12);
      }

      display() {
        strokeCap(ROUND);

        for (let i = 1; i < this.history.length; i++) {
          let p0 = this.history[i - 1];
          let p1 = this.history[i];
          let t = i / max(1, this.history.length - 1);

          let a = 10 + 70 * t;

          stroke(red(this.currentColor), green(this.currentColor), blue(this.currentColor), a);
          strokeWeight(this.thickness);
          line(p0.x, p0.y, p1.x, p1.y);

          stroke(255, 35 * t);
          strokeWeight(this.thickness * 0.33);
          line(p0.x, p0.y, p1.x, p1.y);
        }

        push();
        translate(this.pos.x, this.pos.y);
        rotate(this.vel.heading());
        noStroke();
        fill(255, 90);
        circle(0, 0, this.thickness * 0.55);
        pop();
      }
    }
  </script>
</body>
</html>
