<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo Maze</title>
  <style>
    :root {
      font-family: 'Courier New', Courier, monospace;
      color: #f8f8f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: url('images/DSCF1118.JPG') center/cover fixed;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 3rem;
      font-family: inherit;
    }

    .micro-nav {
      position: fixed;
      top: 1.25rem;
      left: 2rem;
      display: flex;
      gap: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .micro-nav a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.15rem;
      transition: border-color 0.2s ease;
    }

    .micro-nav a:hover,
    .micro-nav a:focus-visible {
      border-color: currentColor;
    }

    .echo-wrap {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(420px, 1.6fr);
      gap: clamp(2rem, 5vw, 4rem);
      align-items: center;
    }

    .echo-text {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      justify-content: center;
    }

    .echo-text h1 {
      margin: 0;
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .echo-text nav {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-size: 1.05rem;
    }

    .echo-text a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      width: fit-content;
      transition: border-color 0.2s ease;
    }

    .echo-text a:hover,
    .echo-text a:focus-visible {
      border-color: currentColor;
    }

    .echo-back {
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
    }

    .echo-images {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2.25rem;
      width: min(720px, 100%);
      margin-left: auto;
    }

    .echo-images img {
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.45);
      display: block;
    }

    @media (max-width: 720px) {
      body {
        padding: 2rem 1rem 3rem;
      }

      .echo-text {
        text-align: center;
        align-items: center;
      }

      .echo-text a {
        margin: 0 auto;
      }

      .echo-wrap {
        grid-template-columns: 1fr;
      }

      .echo-images {
        grid-template-columns: 1fr;
      }
    }
  </style>
<style id="global-nav-style">
  @font-face {
    font-family: "CjNavCormorant";
    src: url("fonts/cormorantgaramond.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    --nav-font-family: "CjNavCormorant", "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --nav-font-size: clamp(1.25rem, 1.1rem + 0.45vw, 1.9rem);
    --nav-letter-spacing: 0.08em;
    --nav-color: #f3e4c7;
    --nav-hover-color: #fff6e4;
    --nav-shadow: 0 1px 6px rgba(0, 0, 0, 0.58);
    --nav-hover-shadow: 0 2px 12px rgba(0, 0, 0, 0.72);
  }

  .micro-nav,
  .site-nav {
    font-family: var(--nav-font-family);
    font-size: var(--nav-font-size);
    letter-spacing: var(--nav-letter-spacing);
    font-weight: 600;
  }

  .micro-nav a,
  .site-nav a {
    color: var(--nav-color) !important;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.18em;
    text-shadow: var(--nav-shadow);
    transition: color 0.25s ease, text-shadow 0.25s ease, border-color 0.25s ease;
  }

  .micro-nav a:hover,
  .micro-nav a:focus-visible,
  .site-nav a:hover,
  .site-nav a:focus-visible {
    color: var(--nav-hover-color) !important;
    text-shadow: var(--nav-hover-shadow);
  }

  @media (max-width: 900px) {
    .micro-nav,
    .site-nav {
      font-size: clamp(1rem, 0.95rem + 0.45vw, 1.25rem);
      letter-spacing: 0.06em;
    }
  }
</style>

</head>
<body>
  <nav class="micro-nav" aria-label="Site navigation">

    <a href="unit-1.html">Echo Maze</a>
    <a href="unit-2.html">Self.exe</a>
    <a href="soulmate.html">Soulmate</a>
    <a href="home.html">More</a>
  </nav>
  <div class="echo-wrap">
    <section class="echo-text" aria-label="Echo Maze navigation">
      <h1>Echo Maze</h1>
      <nav>
        <a href="echo-maze-artist-statement.html">Artist Statement</a>
        <a href="echo-maze-critical-reflection.html">Critical Reflection</a>
        <a href="echo-maze-research-process.html">Research Process</a>
        <a href="echo-maze-outcome.html">Outcome</a>
        <a href="echo-maze-contexts.html">Contexts</a>
      </nav>
      <a class="echo-back" href="index.html">← Back to Home</a>
    </section>

    <section class="echo-images" aria-label="Echo Maze imagery">
      <img src="images/IMG_4449 copy.JPG" alt="Echo Maze collage detail" />
      <img src="images/IMG_4452 copy.JPG" alt="Echo Maze collage detail 2" />
    </section>
  </div>
</body>
</html>
