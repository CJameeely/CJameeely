<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whisper | Small Experiment</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  <style>
    @font-face {
      font-family: "CjNavCormorant";
      src: url("fonts/cormorantgaramond.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      --display: "CjNavCormorant", "Cormorant Garamond", "Times New Roman", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 18%, rgba(127, 146, 166, 0.22), transparent 42%),
        radial-gradient(circle at 78% 72%, rgba(183, 160, 123, 0.18), transparent 40%),
        #06090d;
      color: #efe7d7;
      font-family: var(--display);
      padding: 4.5rem 1rem 1rem;
      display: grid;
      place-items: center;
      gap: 0.8rem;
    }

    .micro-nav {
      position: fixed;
      top: 1.1rem;
      left: 1.2rem;
      display: flex;
      gap: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .micro-nav a {
      color: #f0e2c6;
      text-decoration: none;
    }

    h1 {
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(1.7rem, 1.3rem + 1.5vw, 2.5rem);
    }

    #canvas-shell {
      width: min(640px, 100%);
      background: rgba(10, 14, 18, 0.6);
      border-radius: 18px;
      padding: 0.9rem;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
      display: grid;
      justify-items: center;
    }

    #canvas-shell canvas {
      max-width: 100%;
      height: auto !important;
      display: block;
      border-radius: 12px;
    }

    .hint {
      margin: 0;
      color: #d8dce1;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <nav class="canvas-nav">
    <a href="small-experiment.html">← Small Experiments</a>
    <a href="index.html">CJ Li</a>
  </nav>

  <h1 style="display:none">Whisper</h1>
  <div id="canvas-shell"></div>
  <p class="hint">Move your cursor to reshape the layered field.</p>

  <script>
    let angle = 0;

    function setup() {
      const canvas = createCanvas(600, 600);
      canvas.parent("canvas-shell");
      background(0);
      angleMode(DEGREES);
    }

    function draw() {
      angle = angle + 90 + 0.1;
      push();

      blendMode(ADD);

      translate(width / 2, height / 2);
      rotate(angle);
      noFill();
      stroke(80, 200, 190, 90);
      triangle(-frameCount, 0, 200, 200);

      translate(300, 300);
      rotate(60);
      noFill();
      stroke(255, 140, 70, 45);
      ellipse(-frameCount, 0, 100, 100);

      translate(mouseX, mouseY);
      rotate(30);
      noFill();
      stroke(150, 135, 160, 45);
      rect(-frameCount, 0, 300, 300);
      pop();
    }
  </script>
</body>
</html>
