<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self.exe</title>
  <style>
    :root {
      font-family: 'Courier New', Courier, monospace;
      color: #111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), url('images/Screenshot 2025-06-21 at 15.29.33 copy.png') center/cover fixed;
      color: inherit;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 3rem;
    }

    .self-wrap {
      width: min(760px, 100%);
    }

    .micro-nav {
      position: fixed;
      top: 1.25rem;
      left: 2rem;
      display: flex;
      gap: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .micro-nav a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.15rem;
      transition: border-color 0.2s ease;
    }

    .micro-nav a:hover,
    .micro-nav a:focus-visible {
      border-color: currentColor;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .self-text {
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.76), rgba(250, 244, 234, 0.62));
      border: 1px solid rgba(90, 61, 37, 0.18);
      border-radius: 26px;
      padding: clamp(1.4rem, 3.4vw, 2.4rem);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(3px);
    }

    .self-subtitle {
      margin: 0.8rem 0 1.2rem;
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #61422a;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      font-size: 1.05rem;
    }

    nav a {
      color: #1f1a16;
      text-decoration: none;
      width: fit-content;
      padding: 0.2rem 0;
      letter-spacing: 0.06em;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #5b3821;
      border-color: currentColor;
      transform: translateX(4px);
    }

    .self-back {
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      width: fit-content;
      padding-bottom: 0.2rem;
    }

    .self-image img {
      width: 100%;
      border-radius: 26px;
      display: block;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 720px) {
      body {
        padding: 2rem 1rem 3rem;
      }

      .self-wrap {
        grid-template-columns: 1fr;
      }

      .self-text {
        text-align: center;
        align-items: center;
      }

      nav a,
      .self-back {
        margin: 0 auto;
      }
    }
  </style>
<style id="global-nav-style">
  @font-face {
    font-family: "CjNavCormorant";
    src: url("fonts/cormorantgaramond.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    --nav-font-family: "CjNavCormorant", "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --nav-font-size: clamp(1.25rem, 1.1rem + 0.45vw, 1.9rem);
    --nav-letter-spacing: 0.08em;
    --nav-color: #2f2418;
    --nav-hover-color: #5b3821;
    --nav-shadow: 0 1px 6px rgba(255, 250, 240, 0.55);
    --nav-hover-shadow: 0 2px 10px rgba(255, 248, 232, 0.72);
  }

  .micro-nav,
  .site-nav {
    font-family: var(--nav-font-family);
    font-size: var(--nav-font-size);
    letter-spacing: var(--nav-letter-spacing);
    font-weight: 600;
  }

  .micro-nav a,
  .site-nav a {
    color: var(--nav-color) !important;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.18em;
    text-shadow: var(--nav-shadow);
    transition: color 0.25s ease, text-shadow 0.25s ease, border-color 0.25s ease;
  }

  .micro-nav a:hover,
  .micro-nav a:focus-visible,
  .site-nav a:hover,
  .site-nav a:focus-visible {
    color: var(--nav-hover-color) !important;
    text-shadow: var(--nav-hover-shadow);
  }

  @media (max-width: 900px) {
    .micro-nav,
    .site-nav {
      font-size: clamp(1rem, 0.95rem + 0.45vw, 1.25rem);
      letter-spacing: 0.06em;
    }
  }
</style>





<style id="responsive-baseline">
  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow-x: clip;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
    min-width: 0;
  }

  img,
  video,
  canvas,
  svg {
    max-width: 100%;
    height: auto;
  }

  h1, h2, h3, h4, h5, h6, p, li, a, span {
    overflow-wrap: anywhere;
    word-wrap: break-word;
  }
</style>
<style id="responsive-handmade-override">
  @media (max-width: 900px) {
    body {
      background-attachment: scroll !important;
      padding-inline: clamp(0.75rem, 2.5vw, 1.25rem);
    }

    .micro-nav,
    .site-nav {
      position: static !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      width: 100%;
      flex-wrap: wrap !important;
      gap: clamp(0.5rem, 2vw, 0.9rem) clamp(0.75rem, 2.4vw, 1.25rem) !important;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 0.6rem;
      z-index: auto;
    }

    .micro-nav a,
    .site-nav a {
      display: inline-block;
      padding: 0.2rem 0.25rem;
      line-height: 1.35;
    }

    main,
    .echo-wrap,
    .self-wrap,
    .video-wrap,
    .overview-card,
    .process-card,
    .soulmate-text,
    article,
    section {
      width: min(100%, 100%) !important;
      max-width: 100%;
    }
  }

  @media (max-width: 720px) {
    body {
      padding-inline: 0.85rem;
    }

    h1 { font-size: clamp(1.85rem, 7.6vw, 2.8rem) !important; }
    h2 { font-size: clamp(1.35rem, 5.4vw, 2rem) !important; }
    p, li { font-size: clamp(0.95rem, 3.8vw, 1rem); line-height: 1.6; }
  }

  @media (max-width: 480px) {
    .micro-nav,
    .site-nav {
      gap: 0.45rem 0.7rem !important;
    }

    .micro-nav a,
    .site-nav a {
      padding: 0.15rem 0.2rem;
      font-size: clamp(0.95rem, 4vw, 1.05rem);
    }
  }
</style>
<style id="global-mobile-readable-layout">
  @media (max-width: 900px) {
    main,
    article,
    .echo-wrap,
    .self-wrap,
    .video-wrap,
    .overview-card,
    .process-card,
    .echo-text,
    .self-text,
    .soulmate-text {
      width: min(100%, 740px) !important;
      max-width: 740px !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    main,
    .echo-wrap,
    .self-wrap,
    .video-wrap {
      grid-template-columns: 1fr !important;
    }

    .echo-images,
    .self-images,
    .concept-refs-grid {
      grid-template-columns: 1fr !important;
      justify-items: center !important;
    }

    .echo-images img,
    .self-images img,
    .video-wrap img,
    article img,
    main img {
      display: block;
      margin-left: auto !important;
      margin-right: auto !important;
      object-position: center center;
    }

    main p,
    main li,
    article p,
    article li,
    .echo-text p,
    .self-text p,
    .soulmate-text p {
      max-width: none !important;
      width: 100% !important;
      text-align: left !important;
    }
  }

  @media (max-width: 720px) {
    main,
    article,
    .echo-wrap,
    .self-wrap,
    .video-wrap,
    .overview-card,
    .process-card,
    .echo-text,
    .self-text,
    .soulmate-text {
      width: 100% !important;
      max-width: 100% !important;
    }
  }
</style>
</head>

      </nav>
      <a class="self-back" href="index.html">← Back to Home</a>
    </section>

  </div>
</body>
</html>
