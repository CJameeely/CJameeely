<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self.exe</title>
  <style>
    :root {
      font-family: 'Courier New', Courier, monospace;
      color: #111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), url('images/Screenshot 2025-06-21 at 15.29.33 copy.png') center/cover fixed;
      color: inherit;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6rem 2rem 3rem;
    }

    .self-wrap {
      width: min(760px, 100%);
    }

    .micro-nav {
      position: fixed;
      top: 1.25rem;
      left: 2rem;
      display: flex;
      gap: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .micro-nav a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 0.15rem;
      transition: border-color 0.2s ease;
    }

    .micro-nav a:hover,
    .micro-nav a:focus-visible {
      border-color: currentColor;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    .self-text {
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.76), rgba(250, 244, 234, 0.62));
      border: 1px solid rgba(90, 61, 37, 0.18);
      border-radius: 26px;
      padding: clamp(1.4rem, 3.4vw, 2.4rem);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(3px);
    }

    .self-subtitle {
      margin: 0.8rem 0 1.2rem;
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #61422a;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      font-size: 1.05rem;
    }

    nav a {
      color: #1f1a16;
      text-decoration: none;
      width: fit-content;
      padding: 0.2rem 0;
      letter-spacing: 0.06em;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #5b3821;
      border-color: currentColor;
      transform: translateX(4px);
    }

    .self-back {
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      width: fit-content;
      padding-bottom: 0.2rem;
    }

    .self-image img {
      width: 100%;
      border-radius: 26px;
      display: block;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 720px) {
      body {
        padding: 2rem 1rem 3rem;
      }

      .self-wrap {
        grid-template-columns: 1fr;
      }

      .self-text {
        text-align: center;
        align-items: center;
      }

      nav a,
      .self-back {
        margin: 0 auto;
      }
    }
  </style>
<style id="global-nav-style">
  @font-face {
    font-family: "CjNavCormorant";
    src: url("fonts/cormorantgaramond.woff2") format("woff2");
    font-display: swap;
  }

  :root {
    --nav-font-family: "CjNavCormorant", "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --nav-font-size: clamp(1.25rem, 1.1rem + 0.45vw, 1.9rem);
    --nav-letter-spacing: 0.08em;
    --nav-color: #2f2418;
    --nav-hover-color: #5b3821;
    --nav-shadow: 0 1px 6px rgba(255, 250, 240, 0.55);
    --nav-hover-shadow: 0 2px 10px rgba(255, 248, 232, 0.72);
  }

  .micro-nav,
  .site-nav {
    font-family: var(--nav-font-family);
    font-size: var(--nav-font-size);
    letter-spacing: var(--nav-letter-spacing);
    font-weight: 600;
  }

  .micro-nav a,
  .site-nav a {
    color: var(--nav-color) !important;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    text-decoration-thickness: 0.06em;
    text-underline-offset: 0.18em;
    text-shadow: var(--nav-shadow);
    transition: color 0.25s ease, text-shadow 0.25s ease, border-color 0.25s ease;
  }

  .micro-nav a:hover,
  .micro-nav a:focus-visible,
  .site-nav a:hover,
  .site-nav a:focus-visible {
    color: var(--nav-hover-color) !important;
    text-shadow: var(--nav-hover-shadow);
  }

  @media (max-width: 900px) {
    .micro-nav,
    .site-nav {
      font-size: clamp(1rem, 0.95rem + 0.45vw, 1.25rem);
      letter-spacing: 0.06em;
    }
  }
</style>
